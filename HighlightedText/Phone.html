<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Читання з паузами: телефон</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: desktop only, one screen, 80% of the screen width, full height. Same look as the other reading pages.
   Phase 1 (read-along): one wide card with the text. Words light up one by one; on commas and full stops the highlight stops and the mark turns solid.
   Phase 3 (writing): the filled table on the left, four text boxes (one per table row) on the right.
   Phase 2 (table): the text stays on the left in a smaller size, split into the same parts as the table rows; the table is on the right.
   Buttons are the last element of a card and sit exactly 30px above its bottom edge.
   --fs is the base font size; a script picks the largest value that fits the card height for the current phase. */
:root {
  --bg: #F3F6F7;
  --surface: #FFFFFF;
  --surface-2: #E8EEF1;
  --ink: #1C2630;
  --ink-soft: #4F5D6A;
  --line: #CFD8DE;
  --comma: #AD4A06;
  --comma-bg: #FCE6D2;
  --dot: #1B55C4;
  --dot-bg: #DCE7FB;
  --hl: #FFE98A;
  --hl-line: #8A6A00;
  --btn: #243746;
  --btn-ink: #FFFFFF;
  --ok: #17693F;
  --ok-bg: #DDF1E5;
  --no: #8E3345;
  --no-bg: #F7E2E6;
  --font-read: 'Literata', Georgia, 'Times New Roman', serif;
  --font-ui: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fs: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171C;
    --surface: #1A222A;
    --surface-2: #232D37;
    --ink: #E8EEF3;
    --ink-soft: #A9B7C3;
    --line: #33424F;
    --comma: #FFB566;
    --comma-bg: #3B2A17;
    --dot: #9DBEFF;
    --dot-bg: #1F3050;
    --hl: #4D4210;
    --hl-line: #F0CF4A;
    --btn: #D3E3EE;
    --btn-ink: #11171C;
    --ok: #74D6A0;
    --ok-bg: #173326;
    --no: #F4A3B1;
    --no-bg: #3A1F27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171C;
  --surface: #1A222A;
  --surface-2: #232D37;
  --ink: #E8EEF3;
  --ink-soft: #A9B7C3;
  --line: #33424F;
  --comma: #FFB566;
  --comma-bg: #3B2A17;
  --dot: #9DBEFF;
  --dot-bg: #1F3050;
  --hl: #4D4210;
  --hl-line: #F0CF4A;
  --btn: #D3E3EE;
  --btn-ink: #11171C;
  --ok: #74D6A0;
  --ok-bg: #173326;
  --no: #F4A3B1;
  --no-bg: #3A1F27;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs);
  line-height: 1.5;
  overflow: hidden;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--dot); outline-offset: 2px; }
h2:focus { outline: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { width: 80vw; max-width: 100%; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
.cols { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); gap: 16px; }
.cols.t-read { grid-template-columns: minmax(0, 1fr); }
.cols.t-read .qcard { display: none; }
.cols.t-table { grid-template-columns: minmax(0, .62fr) minmax(0, 1.38fr); }
.cols.t-table .textcard .reading { font-size: .7em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 24px 30px; display: flex; flex-direction: column; gap: .55em; min-width: 0; min-height: 0; overflow: hidden; }

/* buttons: always the last element of a card, pinned 30px above its bottom edge */
.actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: .8em; align-items: center; }
.btn { font-size: .75em; line-height: 1.3; padding: .55em 1.2em; border-radius: .5em; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--ink-soft); }
.btn { white-space: nowrap; }
.btn[data-act="play"] { min-width: 8.6em; }
.btn.primary, .btn[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn:disabled { opacity: .45; cursor: default; color: var(--ink); }
.btn.primary:disabled { color: var(--btn-ink); }
.speed { margin-left: auto; display: flex; align-items: center; gap: .5em; flex-wrap: wrap; }
.spl { font-size: .6em; color: var(--ink-soft); }

/* reading text */
.reading { font-family: var(--font-read); font-size: 1em; line-height: 1.5; letter-spacing: .01em; word-spacing: .1em; margin: 0; }
.reading.blocks { display: flex; flex-direction: column; gap: .3em; }
.sent { display: block; padding: .2em 0 .2em .6em; border-left: .2em solid transparent; color: var(--ink); }
.sent.cur { border-left-color: var(--ink); }
.sent.part { margin-top: .7em; }
.sent.hl { background: var(--hl); border-left-color: var(--hl-line); border-radius: 0 .4em .4em 0; }
.w { white-space: nowrap; }
.w.cur { background: var(--hl); border-radius: .25em; box-shadow: 0 0 0 .1em var(--hl); }
.pc { display: inline-block; font-weight: 700; padding: 0 .12em; margin: 0 .04em; border-radius: .22em; line-height: 1.1; font-size: 1.2em; }
.pc.comma { color: var(--comma); background: var(--comma-bg); }
.pc.dot { color: var(--dot); background: var(--dot-bg); }
.w.pausing .pc.comma { background: var(--comma); color: var(--surface); }
.w.pausing .pc.dot { background: var(--dot); color: var(--surface); }
.pause { font-family: var(--font-ui); font-size: .7em; font-weight: 700; margin-left: .1em; letter-spacing: -.05em; vertical-align: .15em; }
.pause.c { color: var(--comma); }
.pause.d { color: var(--dot); }

/* table */
.tlead { margin: 0; font-size: .6em; color: var(--ink-soft); }
.qwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .55em; margin: 0; }
.tbl { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: .4em .7em; font-size: .8em; }
.tbl th { font-weight: 600; color: var(--ink-soft); text-align: left; vertical-align: bottom; font-size: .85em; line-height: 1.25; padding: 0 .2em; }
.tbl tbody th { color: var(--ink); font-size: 1em; vertical-align: middle; }
.cell { display: block; width: 100%; padding: .45em .55em; border: 2px solid var(--line); border-radius: .4em; background: var(--bg); color: var(--ink); font: inherit; font-size: 1em; line-height: 1.3; resize: none; overflow: hidden; }
.cell.ok { border-color: var(--ok); background: var(--ok-bg); }
.cell.bad { border-color: var(--no); background: var(--no-bg); }
.cell.shown { border-style: dashed; border-color: var(--ink-soft); background: var(--surface-2); }
.cell[readonly] { cursor: default; }
.fbslot { min-height: 2.6em; }
.feedback { padding: .45em .7em; border-radius: .5em; font-weight: 600; font-size: .75em; line-height: 1.4; }
.feedback.ok { background: var(--ok-bg); color: var(--ok); }
.feedback.no { background: var(--no-bg); color: var(--no); }
.feedback.info { background: var(--surface-2); color: var(--ink); }

/* step 3: write each part of the story; the filled table stays on the left as a reference */
.cols.t-gaps { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
.tbl.ref { font-size: .62em; border-spacing: .25em; }
.tbl.ref td { background: var(--surface-2); border-radius: .4em; padding: .5em .4em; vertical-align: top; overflow-wrap: break-word; }
.tbl.ref td.hl { background: var(--hl); box-shadow: 0 0 0 2px var(--hl-line); }
.gl { display: flex; flex-direction: column; gap: .45em; }
.wr { display: block; width: 100%; font-family: var(--font-read); font-size: .8em; line-height: 1.45; padding: .4em .6em; border: 2px solid var(--line); border-radius: .4em; background: var(--bg); color: var(--ink); resize: none; overflow-y: auto; }
.wr.ok { border-color: var(--ok); background: var(--ok-bg); }
.wr.bad { border-color: var(--no); background: var(--no-bg); }
.wr[readonly] { cursor: default; }
.wnote { margin: .15em 0 0; font-size: .6em; line-height: 1.35; color: var(--no); font-weight: 600; }
.wnote.ex { color: var(--ink-soft); font-weight: 400; }
</style>

<div class="wrap">
  <h1 class="vh">Читання з паузами: телефон</h1>
  <div class="cols t-read" id="cols">
    <section class="card textcard" id="textcard" aria-labelledby="h-text"></section>
    <section class="card qcard" id="qcol" aria-labelledby="h-q"></section>
  </div>
  <div id="live" class="vh" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  var SENTENCES = [
    'Денисові 11 років, і він дуже любить кататися на самокаті.',
    'Спочатку Денис приїхав на самокаті в парк.',
    'Він катався по доріжках, і він був веселий.',
    'Потім він сів відпочити на лавку.',
    'На лавці Денис знайшов чужий телефон, і він дуже здивувався.',
    'Після цього він пішов до охоронця біля входу.',
    'Денис віддав йому телефон, але трохи хвилювався.',
    'Наприкінці Денис повернувся додому.',
    'Він розповів усе мамі, і йому стало радісно.',
    'Мама обійняла сина і сказала, що він вчинив чесно.'
  ];
  /* the first sentence of each part of the story (one part = one row of the table) */
  var PART_STARTS = [1, 3, 5, 7];

  /* MATCH-START */
  /* accept: parts of a right answer (lower case, no apostrophes). A number must be a separate word. reject: parts of a wrong answer. ev: the sentence that holds the answer. */
  var HEAD = ['Де був Денис', 'Що зробив Денис', 'Як почувався Денис'];
  var ROWS = [
    { who: 'Спочатку', cells: [
      { accept: ['парк'], reject: [], ans: 'у парку', ev: 1 },
      { accept: ['катав', 'самокат'], reject: [], ans: 'катався на самокаті', ev: 2 },
      { accept: ['весел', 'рад'], reject: [], ans: 'веселий', ev: 2 }
    ] },
    { who: 'Потім', cells: [
      { accept: ['лав'], reject: [], ans: 'на лавці', ev: 3 },
      { accept: ['знайш', 'побач'], reject: [], ans: 'знайшов чужий телефон', ev: 4 },
      { accept: ['здив'], reject: [], ans: 'здивувався', ev: 4 }
    ] },
    { who: 'Після цього', cells: [
      { accept: ['вход', 'вхід', 'охорон'], reject: [], ans: 'біля входу', ev: 5 },
      { accept: ['відда', 'віддав'], reject: [], ans: 'віддав телефон охоронцю', ev: 6 },
      { accept: ['хвилю', 'пережива', 'нерв'], reject: [], ans: 'хвилювався', ev: 6 }
    ] },
    { who: 'Наприкінці', cells: [
      { accept: ['дом'], reject: [], ans: 'удома', ev: 7 },
      { accept: ['розпов', 'мам'], reject: [], ans: 'розповів усе мамі', ev: 8 },
      { accept: ['радіс', 'рад', 'щаслив', 'добре'], reject: [], ans: 'радісно', ev: 8 }
    ] }
  ];
  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[’'`ʼ′]/g, '')
      .replace(/[«»"“”„.,!?;:()\-–—]/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function has(t, a) {
    if (/^\d+$/.test(a)) return t.split(' ').indexOf(a) >= 0;
    return t.indexOf(a) >= 0;
  }
  /* returns null for an empty answer, otherwise true or false */
  function checkAnswer(cell, val) {
    var t = norm(val);
    if (!t) return null;
    var ok = cell.accept.some(function (a) { return has(t, a); });
    if (ok && cell.reject.length) ok = !cell.reject.some(function (a) { return has(t, a); });
    return ok;
  }
  /* MATCH-END */

  var SPEEDS = [{ name: 'Повільно', f: 0.7 }, { name: 'Середньо', f: 1 }, { name: 'Швидко', f: 1.4 }];
  var LS_KEY = 'chytannia-z-pauzamy-telefon-v1';
  var TOTAL = ROWS.length * HEAD.length;

  /* step 3: one text box per table row, starting with the row name. A part is done when it has all three facts of its row and ends with a full stop. */
  var EXAMPLES = [
    'Спочатку Денис був у парку. Він катався на самокаті, і він був веселий.',
    'Потім Денис сидів на лавці. Він знайшов чужий телефон, і він здивувався.',
    'Після цього Денис був біля входу. Він віддав телефон охоронцю, і він хвилювався.',
    'Наприкінці Денис був удома. Він розповів усе мамі, і йому було радісно.'
  ];
  function freshGaps() { return ROWS.map(function (row) { return { val: row.who + ' ', st: '', miss: [], dot: true }; }); }
  /* which facts of row r are missing in the text, and does it end with a full stop */
  function checkPart(r, val) {
    var miss = [];
    ROWS[r].cells.forEach(function (cell, c) { if (checkAnswer(cell, val) !== true) miss.push(c); });
    return { miss: miss, dot: /[.!?]\s*$/.test(val) };
  }

  /* ---------- saved speed and last result (per viewer, optional) ---------- */
  function loadStore() {
    try {
      var o = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      return o && typeof o === 'object' ? o : {};
    } catch (e) { return {}; }
  }
  var store = loadStore();
  function saveStore() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) { /* storage unavailable */ }
  }

  /* ---------- words with timing ---------- */
  var WORDS = [];
  SENTENCES.forEach(function (s, si) {
    s.split(' ').forEach(function (w) {
      var last = w.charAt(w.length - 1);
      WORDS.push({ s: si, len: w.replace(/[^Ѐ-ӿA-Za-z0-9]/g, '').length, punct: last === ',' ? 'comma' : last === '.' ? 'dot' : '' });
    });
  });
  function wordMs(w) { return (280 + 45 * w.len) / SPEEDS[S.speed].f; }
  function pauseMs(w) { return (w.punct === 'comma' ? 700 : w.punct === 'dot' ? 1400 : 0) / SPEEDS[S.speed].f; }

  /* ---------- state ---------- */
  function freshCells() { return ROWS.map(function (row) { return row.cells.map(function () { return { val: '', st: '', shown: false }; }); }); }
  var S = {
    phase: 'read', state: 'idle', pos: 0, inPause: false, timer: null,
    speed: store.speed === 0 || store.speed === 2 ? store.speed : 1,
    readDone: false, hl: null, gh: null, gaps: freshGaps(), gchecks: 0, gex: false, gmsg: null, gdone: false,
    cells: freshCells(), checks: 0, firstCorrect: null, msg: null, done: false, saved: false,
    focus: null
  };

  var cols = document.getElementById('cols');
  var textcard = document.getElementById('textcard');
  var qcol = document.getElementById('qcol');
  var live = document.getElementById('live');
  var wordEls = null, curEl = null, curSent = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function announce(msg) {
    live.textContent = '';
    setTimeout(function () { live.textContent = msg; }, 40);
  }
  function btn(label, attrs, cls) {
    return '<button type="button" class="btn' + (cls ? ' ' + cls : '') + '" ' + attrs + '>' + label + '</button>';
  }

  /* ---------- text card ---------- */
  /* each word is kept together with its punctuation so a mark never starts a new line alone */
  function inner(word) {
    var out = '';
    for (var i = 0; i < word.length; i++) {
      var ch = word.charAt(i);
      if (ch === ',') out += '<span class="pc comma">,</span><span class="pause c" aria-hidden="true">|</span>';
      else if (ch === '.') out += '<span class="pc dot">.</span><span class="pause d" aria-hidden="true">||</span>';
      else out += esc(ch);
    }
    return out;
  }
  function wordHtml(word, wi) {
    return '<span class="w" data-w="' + wi + '">' + inner(word) + '</span>';
  }
  function controlsHtml() {
    var st = S.state, fin = st === 'finished';
    var label = st === 'playing' ? 'Пауза' : st === 'paused' ? 'Продовжити' : fin ? 'Ще раз' : 'Старт';
    var h = '<div class="actions">';
    h += btn(label, 'data-act="play"' + (fin ? '' : ' data-primary'), fin ? '' : 'primary');
    h += btn('Спочатку', 'data-act="reset"' + (st === 'idle' ? ' disabled' : ''));
    h += btn('До таблиці', 'data-act="totable"' + (S.readDone ? '' : ' disabled') + (fin ? ' data-primary' : ''), fin ? 'primary' : '');
    h += '<div class="speed" role="group" aria-label="Швидкість читання"><span class="spl">Швидкість</span>';
    SPEEDS.forEach(function (sp, i) {
      h += btn(sp.name, 'data-act="speed" data-v="' + i + '" aria-pressed="' + (S.speed === i) + '"');
    });
    return h + '</div></div>';
  }
  function renderText() {
    if (S.phase === 'gaps') { renderRef(); return; }
    var h = '<h2 id="h-text" class="vh">Текст</h2><div class="reading blocks">', wi = 0;
    SENTENCES.forEach(function (s, i) {
      var words = s.split(' ').map(function (w) { return wordHtml(w, wi++); }).join(' ');
      var hl = S.phase === 'table' && S.hl === i;
      h += '<span class="sent' + (PART_STARTS.indexOf(i) >= 0 ? ' part' : '') + (hl ? ' hl' : '') + '" data-s="' + i + '">' + words + (hl ? '<span class="vh"> (підсвічене речення)</span>' : '') + '</span>';
    });
    h += '</div>';
    if (S.phase === 'read') h += controlsHtml();
    textcard.innerHTML = h;
    wordEls = null; curEl = null; curSent = null;
    if (S.phase === 'read' && (S.state === 'playing' || S.state === 'paused')) setMark(S.pos, S.inPause);
  }
  function setMark(pos, pausing) {
    if (!wordEls) wordEls = [].slice.call(textcard.querySelectorAll('.w'));
    if (curEl) curEl.classList.remove('cur', 'pausing');
    if (curSent) curSent.classList.remove('cur');
    curEl = wordEls[pos] || null;
    curSent = null;
    if (curEl) {
      curEl.classList.add('cur');
      if (pausing) curEl.classList.add('pausing');
      curSent = curEl.parentNode;
      curSent.classList.add('cur');
    }
  }
  function applyHl() {
    var els = textcard.querySelectorAll('.sent');
    for (var i = 0; i < els.length; i++) els[i].classList.toggle('hl', S.phase === 'table' && S.hl === i);
  }

  /* ---------- read-along ---------- */
  function playStep() {
    if (S.state !== 'playing') return;
    var w = WORDS[S.pos];
    S.inPause = false;
    setMark(S.pos, false);
    S.timer = setTimeout(function () {
      if (S.state !== 'playing') return;
      if (w.punct) {
        S.inPause = true;
        setMark(S.pos, true);
        S.timer = setTimeout(advance, pauseMs(w));
      } else {
        advance();
      }
    }, wordMs(w));
  }
  function advance() {
    if (S.state !== 'playing') return;
    S.inPause = false;
    S.pos++;
    if (S.pos >= WORDS.length) finishReading(); else playStep();
  }
  function stopTimer() { clearTimeout(S.timer); S.timer = null; }
  function finishReading() {
    stopTimer();
    S.state = 'finished'; S.readDone = true; S.pos = 0; S.inPause = false;
    renderText();
    S.focus = '[data-primary]';
    postRender();
    announce('Читання завершено. Тепер можна заповнити таблицю.');
  }

  /* ---------- table card ---------- */
  function cellDone(st) { return st.st === 'ok' || st.shown; }
  function allCellsDone() {
    return S.cells.every(function (row) { return row.every(cellDone); });
  }
  function renderRight() {
    if (S.phase === 'gaps') { renderGaps(); return; }
    if (S.phase !== 'table') { qcol.innerHTML = ''; return; }
    var h = '<h2 id="h-q" class="vh">Таблиця</h2>';
    h += '<p class="tlead">Заповни таблицю. Кожен рядок — це одна частина тексту: Спочатку, Потім, Після цього, Наприкінці.</p>';
    h += '<form class="qwrap" id="tform" novalidate><table class="tbl"><colgroup><col style="width:17%"><col style="width:25%"><col style="width:33%"><col style="width:25%"></colgroup>';
    h += '<thead><tr><th scope="col"><span class="vh">Хто</span></th>';
    HEAD.forEach(function (t) { h += '<th scope="col">' + esc(t) + '</th>'; });
    h += '</tr></thead><tbody>';
    ROWS.forEach(function (row, r) {
      h += '<tr><th scope="row">' + esc(row.who) + '</th>';
      row.cells.forEach(function (cell, c) {
        var st = S.cells[r][c];
        var cls = 'cell' + (st.st === 'ok' ? ' ok' : st.st === 'bad' ? ' bad' : '') + (st.shown ? ' shown' : '');
        h += '<td><textarea rows="3" class="' + cls + '" id="c-' + r + '-' + c + '" autocomplete="off" spellcheck="false" data-r="' + r + '" data-c="' + c + '" data-ev="' + cell.ev + '"' +
          ' aria-label="' + esc(row.who + ': ' + HEAD[c].toLowerCase()) + '"' + (cellDone(st) ? ' readonly' : '') + '>' + esc(st.val) + '</textarea></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
    var fb = '';
    if (S.done) fb = '<div class="feedback ok">Готово. З першої перевірки правильно: ' + (S.firstCorrect || 0) + ' з ' + TOTAL + '.</div>';
    else if (S.msg) fb = '<div class="feedback ' + S.msg.t + '">' + esc(S.msg.x) + '</div>';
    h += '<div class="fbslot">' + fb + '</div>';
    if (S.done) {
      h += '<div class="actions">' + btn('Прочитати ще раз', 'data-act="redo"') + btn('Далі: напиши історію', 'data-act="togaps" data-primary', 'primary') + '</div>';
    } else {
      h += '<div class="actions">' + btn('До читання', 'data-act="toread"') +
        (S.checks >= 2 ? btn('Показати відповіді', 'data-act="reveal"') : '') +
        '<button type="submit" class="btn primary">Перевірити</button></div>';
    }
    qcol.innerHTML = h + '</form>';
  }

  /* step 3 */
  function renderRef() {
    var h = '<h2 id="h-text" class="vh">Таблиця</h2><p class="tlead">Це твоя таблиця. Дивись у неї, коли пишеш.</p>';
    h += '<table class="tbl ref"><colgroup><col style="width:25%"><col style="width:21%"><col style="width:27%"><col style="width:27%"></colgroup><thead><tr><th scope="col"><span class="vh">Хто</span></th>';
    HEAD.forEach(function (t) { h += '<th scope="col">' + esc(t) + '</th>'; });
    h += '</tr></thead><tbody>';
    ROWS.forEach(function (row, r) {
      h += '<tr><th scope="row">' + esc(row.who) + '</th>';
      row.cells.forEach(function (cell, c) {
        h += '<td class="rc' + (S.gh === r ? ' hl' : '') + '" data-k="' + r + '-' + c + '">' + esc(cell.ans) + '</td>';
      });
      h += '</tr>';
    });
    textcard.innerHTML = h + '</tbody></table>';
    wordEls = null; curEl = null; curSent = null;
  }
  function applyGh() {
    var els = textcard.querySelectorAll('.rc');
    for (var i = 0; i < els.length; i++) els[i].classList.toggle('hl', S.phase === 'gaps' && S.gh !== null && els[i].getAttribute('data-k').split('-')[0] === String(S.gh));
  }
  function allGapsDone() { return S.gaps.every(function (g) { return g.st === 'ok'; }); }
  function renderGaps() {
    var h = '<h2 id="h-q" class="vh">Напиши історію</h2>';
    h += '<p class="tlead">Напиши кожну частину історії. Дивись у таблицю: де був Денис, що він зробив, як він почувався. В кінці постав крапку.</p>';
    h += '<form class="qwrap" id="gform" novalidate><div class="gl">';
    S.gaps.forEach(function (g, r) {
      var cls = 'wr' + (g.st === 'ok' ? ' ok' : g.st === 'bad' ? ' bad' : '');
      h += '<div><textarea rows="3" class="' + cls + '" id="g-' + r + '" data-r="' + r + '" autocomplete="off" spellcheck="false" aria-label="' + esc(ROWS[r].who) + '"' +
        (g.st === 'ok' ? ' readonly' : '') + '>' + esc(g.val) + '</textarea>';
      if (g.st === 'bad') {
        var parts = [];
        if (g.miss.length) parts.push('Додай: ' + g.miss.map(function (c) { return HEAD[c].charAt(0).toLowerCase() + HEAD[c].slice(1); }).join(', ') + '.');
        if (!g.dot) parts.push('Постав крапку в кінці.');
        h += '<p class="wnote" id="n-' + r + '">' + esc(parts.join(' ')) + '</p>';
      }
      if (S.gex && g.st !== 'ok') h += '<p class="wnote ex">Приклад: ' + esc(EXAMPLES[r]) + '</p>';
      h += '</div>';
    });
    h += '</div>';
    var fb = '';
    if (S.gdone) fb = '<div class="feedback ok">Готово. Ти написав усю історію.</div>';
    else if (S.gmsg) fb = '<div class="feedback ' + S.gmsg.t + '">' + esc(S.gmsg.x) + '</div>';
    h += '<div class="fbslot">' + fb + '</div>';
    if (S.gdone) {
      h += '<div class="actions">' + btn('До таблиці', 'data-act="totable"') + btn('Прочитати ще раз', 'data-act="redo" data-primary', 'primary') + '</div>';
    } else {
      h += '<div class="actions">' + btn('До таблиці', 'data-act="totable"') +
        (S.gchecks >= 2 && !S.gex ? btn('Показати приклад', 'data-act="revealg"') : '') +
        '<button type="submit" class="btn primary">Перевірити</button></div>';
    }
    qcol.innerHTML = h + '</form>';
  }
  function checkGaps() {
    var okCount = 0;
    S.gaps.forEach(function (g, r) {
      if (g.st === 'ok') { okCount++; return; }
      var res = checkPart(r, g.val);
      g.miss = res.miss; g.dot = res.dot;
      if (!res.miss.length && res.dot) { g.st = 'ok'; okCount++; } else { g.st = 'bad'; }
    });
    S.gchecks++;
    if (allGapsDone()) {
      S.gdone = true; S.gmsg = null;
      announce('Готово. Ти написав усю історію.');
      S.focus = '[data-primary]';
    } else {
      S.gmsg = { t: 'no', x: 'Готово частин: ' + okCount + ' з ' + S.gaps.length + '. Допиши частини з червоною рамкою.' };
      announce(S.gmsg.x);
      var firstBad = null;
      S.gaps.forEach(function (g, r) { if (!firstBad && g.st === 'bad') firstBad = '#g-' + r; });
      S.focus = firstBad;
    }
    refit(); /* notes under the boxes take space: pick the font size again */
  }

  function checkTable() {
    var okCount = 0, filled = 0;
    ROWS.forEach(function (row, r) {
      row.cells.forEach(function (cell, c) {
        var st = S.cells[r][c];
        if (cellDone(st)) { if (st.st === 'ok') okCount++; return; }
        var res = checkAnswer(cell, st.val);
        if (res !== null) filled++;
        if (res === true) { st.st = 'ok'; okCount++; } else { st.st = 'bad'; }
      });
    });
    S.checks++;
    if (S.checks === 1) S.firstCorrect = okCount;
    if (allCellsDone()) {
      S.done = true; S.msg = null;
      finishTable();
      announce('Готово. Усі клітинки правильні.');
      S.focus = '[data-primary]';
    } else {
      S.msg = { t: 'no', x: 'Правильно: ' + okCount + ' з ' + TOTAL + '. Виправ клітинки з червоною рамкою.' };
      announce(S.msg.x);
      var firstBad = null;
      for (var r2 = 0; r2 < S.cells.length && !firstBad; r2++) {
        for (var c2 = 0; c2 < S.cells[r2].length; c2++) { if (S.cells[r2][c2].st === 'bad') { firstBad = '#c-' + r2 + '-' + c2; break; } }
      }
      S.focus = firstBad;
    }
    renderRight();
  }
  function finishTable() {
    if (!S.saved) {
      store.result = { first: S.firstCorrect || 0, total: TOTAL };
      saveStore();
      S.saved = true;
    }
  }

  /* ---------- font size: the largest value for which everything fits in the card height ---------- */
  function overflows(el) { return el.scrollHeight > el.clientHeight + 1; }
  /* the last button must keep its 30px distance from the bottom edge of the card */
  function bottomGapOk(card) {
    var b = card.querySelectorAll('.actions .btn');
    if (!b.length) return true;
    return card.getBoundingClientRect().bottom - b[b.length - 1].getBoundingClientRect().bottom - 1 >= 29;
  }
  function cardsFit() {
    return !overflows(textcard) && !overflows(qcol) && bottomGapOk(textcard) && bottomGapOk(qcol);
  }
  function selFor(el) {
    if (!el || el === document.body) return null;
    if (el.id) return '#' + el.id;
    var a = el.getAttribute && el.getAttribute('data-act');
    if (a) return '[data-act="' + a + '"]' + (el.getAttribute('data-v') ? '[data-v="' + el.getAttribute('data-v') + '"]' : '');
    return null;
  }
  function applyLayout() { cols.className = 'cols ' + (S.phase === 'table' ? 't-table' : S.phase === 'gaps' ? 't-gaps' : 't-read'); }
  function refit() {
    var ae = document.activeElement, sel = selFor(ae), ss = null, se = null;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) {
      try { ss = ae.selectionStart; se = ae.selectionEnd; } catch (e) { /* ignore */ }
    }
    var lo = 9, hi = 72, best = 9;
    while (hi - lo > 0.5) {
      var mid = (lo + hi) / 2;
      document.documentElement.style.setProperty('--fs', mid + 'px');
      renderText(); renderRight();
      if (cardsFit()) { best = mid; lo = mid; } else { hi = mid; }
    }
    document.documentElement.style.setProperty('--fs', best + 'px');
    renderText(); renderRight();
    if (sel) {
      var e2 = document.querySelector(sel);
      if (e2) {
        e2.focus({ preventScroll: true });
        if (ss !== null) { try { e2.setSelectionRange(ss, se); } catch (e) { /* ignore */ } }
      }
    }
  }
  function postRender() {
    if (S.focus) {
      var f = document.querySelector(S.focus);
      if (f) f.focus({ preventScroll: true });
      S.focus = null;
    }
  }
  function go(phase) {
    stopTimer();
    S.phase = phase; S.state = 'idle'; S.pos = 0; S.inPause = false;
    applyLayout();
    refit();
  }

  /* ---------- actions ---------- */
  function act(name, el) {
    switch (name) {
      case 'play':
        if (S.state === 'playing') {
          stopTimer(); S.state = 'paused';
          renderText();
        } else {
          if (S.state === 'finished') S.pos = 0;
          S.state = 'playing'; S.inPause = false;
          renderText();
          playStep();
        }
        S.focus = '[data-act="play"]';
        break;
      case 'reset':
        stopTimer(); S.state = 'idle'; S.pos = 0; S.inPause = false;
        renderText();
        S.focus = '[data-act="play"]';
        break;
      case 'speed':
        S.speed = Number(el.getAttribute('data-v')); store.speed = S.speed; saveStore();
        renderText();
        S.focus = '[data-act="speed"][data-v="' + S.speed + '"]';
        break;
      case 'totable':
        if (!S.readDone) return;
        go('table');
        S.focus = '#c-0-0';
        break;
      case 'toread':
        go('read');
        S.focus = '[data-act="play"]';
        break;
      case 'reveal':
        ROWS.forEach(function (row, r) {
          row.cells.forEach(function (cell, c) {
            var st = S.cells[r][c];
            if (!cellDone(st)) { st.val = cell.ans; st.shown = true; st.st = ''; }
          });
        });
        S.done = true; S.msg = null;
        finishTable();
        announce('Відповіді показано.');
        renderRight();
        S.focus = '[data-primary]';
        break;
      case 'togaps':
        if (!S.done) return;
        go('gaps');
        S.focus = '#g-0';
        break;
      case 'revealg':
        S.gex = true;
        announce('Під кожною частиною є приклад.');
        refit();
        S.focus = '#g-0';
        break;
      case 'redo':
        S.cells = freshCells(); S.checks = 0; S.firstCorrect = null; S.msg = null; S.done = false; S.saved = false; S.hl = null; S.readDone = false;
        S.gaps = freshGaps(); S.gchecks = 0; S.gex = false; S.gmsg = null; S.gdone = false; S.gh = null;
        go('read');
        S.focus = '[data-primary]';
        break;
    }
    postRender();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    act(el.getAttribute('data-act'), el);
  });
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (form.id === 'tform') {
      e.preventDefault();
      if (!S.done) { checkTable(); postRender(); }
    } else if (form.id === 'gform') {
      e.preventDefault();
      if (!S.gdone) { checkGaps(); postRender(); }
    }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Enter' && t && t.classList && t.classList.contains('cell')) {
      e.preventDefault();
      if (!S.done) { checkTable(); postRender(); }
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('cell')) {
      var st = S.cells[Number(t.getAttribute('data-r'))][Number(t.getAttribute('data-c'))];
      st.val = t.value;
      if (st.st === 'bad') { st.st = ''; t.classList.remove('bad'); }
    } else if (t && t.classList && t.classList.contains('wr')) {
      S.gaps[Number(t.getAttribute('data-r'))].val = t.value;
    }
  });
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('wr')) {
      S.gh = Number(t.getAttribute('data-r'));
      applyGh();
      /* a box that still holds only the part name: put the cursor after it */
      if (t.value.trim() === ROWS[S.gh].who && !t.readOnly) {
        setTimeout(function () { try { var n = t.value.length; t.setSelectionRange(n, n); } catch (err) { /* ignore */ } }, 0);
      }
    }
  });

  var timer = null;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(refit, 150);
  });

  applyLayout();
  renderText();
  renderRight();
  refit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
})();
</script>

</body></html>
