<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A Family Flies on Holiday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: desktop only. Two cards fill the whole height of the screen.
   Left (wider): the text, one line per sentence where possible. Right: the current question with its input, short rows for answered ones.
   Buttons are the last element in each card and sit exactly 30px above its bottom edge.
   --fs is the base font size. A script picks the largest value for which everything fits in the card height. */
:root {
  --bg: #F3F6F7;
  --surface: #FFFFFF;
  --surface-2: #E8EEF1;
  --ink: #1C2630;
  --ink-soft: #4F5D6A;
  --line: #CFD8DE;
  --comma: #AD4A06;
  --comma-bg: #FCE6D2;
  --dot: #1B55C4;
  --dot-bg: #DCE7FB;
  --hl: #FFE98A;
  --hl-line: #8A6A00;
  --btn: #243746;
  --btn-ink: #FFFFFF;
  --ok: #17693F;
  --ok-bg: #DDF1E5;
  --no: #8E3345;
  --no-bg: #F7E2E6;
  --font-read: 'Literata', Georgia, 'Times New Roman', serif;
  --font-ui: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --fs: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171C;
    --surface: #1A222A;
    --surface-2: #232D37;
    --ink: #E8EEF3;
    --ink-soft: #A9B7C3;
    --line: #33424F;
    --comma: #FFB566;
    --comma-bg: #3B2A17;
    --dot: #9DBEFF;
    --dot-bg: #1F3050;
    --hl: #4D4210;
    --hl-line: #F0CF4A;
    --btn: #D3E3EE;
    --btn-ink: #11171C;
    --ok: #74D6A0;
    --ok-bg: #173326;
    --no: #F4A3B1;
    --no-bg: #3A1F27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171C;
  --surface: #1A222A;
  --surface-2: #232D37;
  --ink: #E8EEF3;
  --ink-soft: #A9B7C3;
  --line: #33424F;
  --comma: #FFB566;
  --comma-bg: #3B2A17;
  --dot: #9DBEFF;
  --dot-bg: #1F3050;
  --hl: #4D4210;
  --hl-line: #F0CF4A;
  --btn: #D3E3EE;
  --btn-ink: #11171C;
  --ok: #74D6A0;
  --ok-bg: #173326;
  --no: #F4A3B1;
  --no-bg: #3A1F27;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs);
  line-height: 1.5;
  overflow: hidden;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--dot); outline-offset: 2px; }
h2:focus, .qwrap:focus { outline: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { width: 80vw; max-width: 100%; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 24px 30px; display: flex; flex-direction: column; gap: .55em; min-width: 0; min-height: 0; overflow: hidden; }

/* buttons: always the last element of a card, pinned 30px above its bottom edge */
.actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: .8em; align-items: center; }
.btn { font-size: .75em; line-height: 1.3; padding: .55em 1.2em; border-radius: .5em; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--ink-soft); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn:disabled { opacity: .45; cursor: default; color: var(--ink); }

.counter { margin: 0; font-size: .6em; color: var(--ink-soft); }

/* reading text */
.reading { font-family: var(--font-read); font-size: 1em; line-height: 1.5; letter-spacing: .01em; word-spacing: .1em; margin: 0; }
.reading.blocks { display: flex; flex-direction: column; gap: .3em; }
.sent { display: block; padding: .2em 0 .2em .6em; border-left: .2em solid transparent; color: var(--ink-soft); }
.sent.current { border-left-color: var(--ink); color: var(--ink); }
.sent.unseen { visibility: hidden; }
.textcard.quiz .sent { color: var(--ink); }
.sent.hl { background: var(--hl); border-left-color: var(--hl-line); border-radius: 0 .4em .4em 0; }
.pc { display: inline-block; font-weight: 700; padding: 0 .12em; margin: 0 .04em; border-radius: .22em; line-height: 1.1; font-size: 1.2em; }
.pc.comma { color: var(--comma); background: var(--comma-bg); }
.pc.dot { color: var(--dot); background: var(--dot-bg); }
.pause { font-family: var(--font-ui); font-size: .7em; font-weight: 700; margin-left: .1em; letter-spacing: -.05em; vertical-align: .15em; }
.pause.c { color: var(--comma); }
.pause.d { color: var(--dot); }
.w { white-space: nowrap; }

/* questions */
.ph-text { margin: 0; font-size: .8em; color: var(--ink-soft); }
.qwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .55em; margin: 0; }
.qnum { margin: 0; font-size: .6em; color: var(--ink-soft); letter-spacing: .02em; }
.question { display: block; font-family: var(--font-read); font-weight: 600; font-size: 1em; line-height: 1.35; }
.ans { width: 100%; padding: .4em .7em; border: 2px solid var(--line); border-radius: .4em; background: var(--bg); color: var(--ink); font-size: .9em; }
.ans::placeholder { color: var(--ink-soft); opacity: 1; }
.ans[readonly] { cursor: default; }
.ans.ok { border-color: var(--ok); background: var(--ok-bg); }
.fbslot { min-height: 2.9em; }
.feedback { padding: .45em .7em; border-radius: .5em; font-weight: 600; font-size: .75em; line-height: 1.4; }
.feedback.ok { background: var(--ok-bg); color: var(--ok); }
.feedback.no { background: var(--no-bg); color: var(--no); }
.feedback.info { background: var(--surface-2); color: var(--ink); }
.sumh { margin: 0; font-family: var(--font-read); font-weight: 600; font-size: 1em; }
.sump { margin: 0; font-size: .85em; }

/* answered questions: short rows */
.qlist { list-style: none; margin: .3em 0 0; padding: .6em 0 0; border-top: 1px solid var(--line); font-size: .62em; display: flex; flex-direction: column; gap: .3em; }
.qlist li { display: grid; grid-template-columns: 1.8em minmax(0, 1fr) auto; gap: .4em; align-items: baseline; }
.rn { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.rq { color: var(--ink-soft); }
.ra { font-weight: 700; color: var(--ink); }
.mark { color: var(--ok); font-weight: 700; }
.mark.shown { color: var(--ink-soft); }
</style>

<div class="wrap">
  <h1 class="vh">A Family Flies on Holiday</h1>
  <div class="cols">
    <section class="card textcard" id="textcard" aria-labelledby="h-text"></section>
    <section class="card qcard" id="qcol" aria-labelledby="h-q"></section>
  </div>
  <div id="live" class="vh" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  var SENTENCES = [
    'A family of three flew to Spain on holiday.',
    'The dad was called Bohdan, and he was 40 years old.',
    'Bohdan works as a doctor in the city hospital.',
    'The mum was called Nataliia, and she was 38 years old.',
    'Nataliia works as an accountant in a bank.',
    'Their daughter, Solomiia, was 12 years old.',
    'Solomiia is in grade 6, and she also goes to dance classes.',
    'The flight was in the morning, and it lasted four hours.',
    'Solomiia listened to music, and her mum read a book.',
    'In the evening, they landed and went to the hotel.'
  ];

  /* MATCH-START */
  /* accept: parts of a right answer (lower case, no apostrophes). A number must be a separate word. reject: parts of a wrong answer. */
  var QUESTIONS = [
    { q: 'Where did the family fly?', accept: ['spain', 'spanish'], reject: [], ans: 'to Spain', say: 'The family flew to Spain on holiday.', ev: [0] },
    { q: 'What was the dad called?', accept: ['bohdan', 'bogdan'], reject: ['natali', 'solom'], ans: 'Bohdan', say: 'The dad was called Bohdan.', ev: [1] },
    { q: 'How old was the dad?', accept: ['40', 'forty'], reject: [], ans: '40 years old', say: 'The dad was 40 years old.', ev: [1] },
    { q: 'Where does the dad work?', accept: ['hospital', 'doctor'], reject: [], ans: 'he is a doctor in the city hospital', say: 'Bohdan works as a doctor in the city hospital.', ev: [2] },
    { q: 'What was the mum called?', accept: ['natali'], reject: ['bohdan', 'bogdan', 'solom'], ans: 'Nataliia', say: 'The mum was called Nataliia.', ev: [3] },
    { q: 'How old was the mum?', accept: ['38', 'thirty eight', 'thirtyeight'], reject: [], ans: '38 years old', say: 'The mum was 38 years old.', ev: [3] },
    { q: 'Where does the mum work?', accept: ['bank', 'accountant'], reject: [], ans: 'she is an accountant in a bank', say: 'Nataliia works as an accountant in a bank.', ev: [4] },
    { q: 'What was the daughter called?', accept: ['solom'], reject: ['bohdan', 'bogdan', 'natali'], ans: 'Solomiia', say: 'The daughter was called Solomiia.', ev: [5] },
    { q: 'How old was Solomiia?', accept: ['12', 'twelve'], reject: [], ans: '12 years old', say: 'Solomiia was 12 years old.', ev: [5] },
    { q: 'Which grade is Solomiia in?', accept: ['6', 'six', 'sixth'], reject: [], ans: 'grade 6', say: 'Solomiia is in grade 6.', ev: [6] },
    { q: 'How many hours did the flight last?', accept: ['4', 'four'], reject: [], ans: '4 hours', say: 'The flight lasted four hours.', ev: [7] },
    { q: 'Where did they go after landing?', accept: ['hotel'], reject: [], ans: 'to the hotel', say: 'After landing, they went to the hotel.', ev: [9] }
  ];
  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[’'`ʼ′]/g, '')
      .replace(/[«»"“”„.,!?;:()\-–—]/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function has(t, a) {
    if (/^\d+$/.test(a)) return t.split(' ').indexOf(a) >= 0;
    return t.indexOf(a) >= 0;
  }
  /* returns null for an empty answer, otherwise true or false */
  function checkAnswer(qd, val) {
    var t = norm(val);
    if (!t) return null;
    var ok = qd.accept.some(function (a) { return has(t, a); });
    if (ok && qd.reject.length) ok = !qd.reject.some(function (a) { return has(t, a); });
    return ok;
  }
  /* MATCH-END */

  var LS_KEY = 'family-holiday-en-v1';

  /* ---------- last result (per viewer, optional) ---------- */
  function loadStore() {
    try {
      var o = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
      return o && typeof o === 'object' ? o : {};
    } catch (e) { return {}; }
  }
  var store = loadStore();
  function saveStore() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) { /* storage unavailable */ }
  }

  /* ---------- state ---------- */
  var S = { phase: 'read', reveal: 1, cur: 0, qs: [], saved: false, focus: null, select: false };
  function freshQs() { return QUESTIONS.map(function () { return { val: '', wrong: 0, done: false, shown: false, msg: '' }; }); }
  S.qs = freshQs();

  var textcard = document.getElementById('textcard');
  var qcol = document.getElementById('qcol');
  var live = document.getElementById('live');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function announce(msg) {
    live.textContent = '';
    setTimeout(function () { live.textContent = msg; }, 40);
  }
  function allDone() { return S.qs.every(function (q) { return q.done; }); }
  function firstTries() {
    return S.qs.filter(function (q) { return q.done && !q.shown && q.wrong === 0; }).length;
  }
  /* commas and full stops get colour and pause marks; each word is kept together with its punctuation so a mark never starts a new line alone */
  function fmt(s) {
    return s.split(' ').map(function (word) {
      var out = '';
      for (var i = 0; i < word.length; i++) {
        var ch = word.charAt(i);
        if (ch === ',') out += '<span class="pc comma">,</span><span class="pause c" aria-hidden="true">|</span>';
        else if (ch === '.') out += '<span class="pc dot">.</span><span class="pause d" aria-hidden="true">||</span>';
        else out += esc(ch);
      }
      return '<span class="w">' + out + '</span>';
    }).join(' ');
  }
  function btn(label, attrs, cls) {
    return '<button type="button" class="btn' + (cls ? ' ' + cls : '') + '" ' + attrs + '>' + label + '</button>';
  }

  /* ---------- text card ---------- */
  function renderText() {
    var quiz = S.phase === 'quiz', n = SENTENCES.length;
    var hl = quiz && !allDone() ? QUESTIONS[S.cur].ev : [];
    var h = '<h2 id="h-text" class="vh">Text</h2>';
    h += quiz ? '<p class="counter" aria-hidden="true">&nbsp;</p>' : '<p class="counter">Sentence ' + S.reveal + ' of ' + n + '</p>';
    h += '<div class="reading blocks">';
    SENTENCES.forEach(function (s, i) {
      var cls = 'sent', mark = '';
      if (!quiz) {
        if (i >= S.reveal) cls += ' unseen'; else if (i === S.reveal - 1) cls += ' current';
      } else if (hl.indexOf(i) >= 0) {
        cls += ' hl'; mark = '<span class="vh"> (highlighted sentence)</span>';
      }
      h += '<span class="' + cls + '">' + fmt(s) + mark + '</span>';
    });
    h += '</div>';
    if (!quiz) {
      h += '<div class="actions">' +
        btn('Back', 'data-act="prev"' + (S.reveal <= 1 ? ' disabled' : '')) +
        (S.reveal < n ? btn('Next', 'data-act="rnext" data-primary', 'primary') : btn('Go to questions', 'data-act="goq" data-primary', 'primary')) +
        '</div>';
    }
    textcard.className = 'card textcard' + (quiz ? ' quiz' : '');
    textcard.innerHTML = h;
  }

  /* ---------- questions ---------- */
  function rowsHtml(upTo) {
    var h = '<ol class="qlist" aria-label="Already answered">';
    for (var i = 0; i < upTo; i++) {
      var qd = QUESTIONS[i], st = S.qs[i];
      var ra = st.shown ? esc(qd.ans) + ' (shown)' : esc(st.val.trim() || qd.ans);
      h += '<li><span class="rn">' + (i + 1) + '.</span><span><span class="rq">' + esc(qd.q) + '</span> <span class="ra">' + ra + '</span></span>' +
        '<span class="mark' + (st.shown ? ' shown' : '') + '" aria-hidden="true">' + (st.shown ? '–' : '✓') + '</span></li>';
    }
    return h + '</ol>';
  }
  function currentHtml(i) {
    var qd = QUESTIONS[i], st = S.qs[i], n = QUESTIONS.length;
    var h = '<form class="qwrap" id="qi-' + i + '" data-q="' + i + '" novalidate>';
    h += '<p class="qnum">Question ' + (i + 1) + ' of ' + n + '</p>';
    h += '<label class="question" for="ans-' + i + '">' + esc(qd.q) + '</label>';
    h += '<input class="ans' + (st.done && !st.shown ? ' ok' : '') + '" id="ans-' + i + '" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" placeholder="Type your answer" value="' + esc(st.val) + '"' + (st.done ? ' readonly' : '') + ' aria-describedby="fb-' + i + '">';
    var fb = '';
    if (st.done && !st.shown) fb = '<div class="feedback ok">Yes. ' + esc(qd.say) + '</div>';
    else if (st.done) fb = '<div class="feedback info">Answer: ' + esc(qd.say) + '</div>';
    else if (st.msg === 'empty') fb = '<div class="feedback info">Type your answer in the box and press “Check”.</div>';
    else if (st.msg === 'wrong') fb = '<div class="feedback no">Not yet. Read the highlighted sentence again and try once more.</div>';
    h += '<div class="fbslot" id="fb-' + i + '">' + fb + '</div>';
    if (i > 0) h += rowsHtml(i);
    if (!st.done) {
      h += '<div class="actions">' +
        (st.wrong >= 2 ? btn('Show answer', 'data-act="show" data-q="' + i + '"') : '') +
        '<button type="submit" class="btn primary">Check</button></div>';
    } else {
      h += '<div class="actions">' + btn('Next question', 'data-act="qnext" data-primary', 'primary') + '</div>';
    }
    return h + '</form>';
  }
  function summaryHtml() {
    return '<div class="qwrap" id="summary" tabindex="-1"><h3 class="sumh">Done</h3>' +
      '<p class="sump">Correct on the first try: ' + firstTries() + ' of ' + QUESTIONS.length + '.</p>' +
      rowsHtml(QUESTIONS.length) +
      '<div class="actions">' + btn('Read again', 'data-act="redo"', 'primary') + '</div></div>';
  }
  function renderQuiz() {
    var total = QUESTIONS.length, h = '<h2 id="h-q" class="vh">Questions</h2>';
    if (S.phase !== 'quiz') {
      h += '<p class="ph-text">The questions will appear here when you finish reading. Number of questions: ' + total + '.</p>' +
        '<p class="ph-text">Answer each question in the box under it.</p>';
      if (store.result && typeof store.result.first === 'number') {
        h += '<p class="ph-text">Last time: ' + store.result.first + ' of ' + store.result.total + ' correct on the first try.</p>';
      }
    } else {
      h += allDone() ? summaryHtml() : currentHtml(S.cur);
    }
    qcol.innerHTML = h;
  }

  function postRender() {
    if (S.focus) {
      var f = document.querySelector(S.focus);
      if (f) { f.focus({ preventScroll: true }); if (S.select && f.select) f.select(); }
      S.focus = null; S.select = false;
    }
  }

  function finishIfDone() {
    if (allDone() && !S.saved) {
      store.result = { first: firstTries(), total: QUESTIONS.length };
      saveStore();
      S.saved = true;
    }
  }

  /* ---------- font size: the largest value for which everything fits in the card height ---------- */
  function overflows(el) { return el.scrollHeight > el.clientHeight + 1; }
  function bothFit() { return !overflows(textcard) && !overflows(qcol); }
  function fitsAtCurrentSize() {
    var n = SENTENCES.length, last = QUESTIONS.length - 1;
    /* reading: all sentences shown, last button */
    S.phase = 'read'; S.reveal = n; renderText(); renderQuiz();
    if (!bothFit()) return false;
    /* questions: the last question with an error message, two buttons and all earlier answers as rows */
    S.phase = 'quiz'; S.cur = last;
    S.qs = QUESTIONS.map(function (q, i) {
      return { val: q.ans, wrong: i === last ? 2 : 0, done: i < last, shown: false, msg: i === last ? 'wrong' : '' };
    });
    renderText(); renderQuiz();
    if (!bothFit()) return false;
    /* summary with all rows */
    S.qs = QUESTIONS.map(function (q) { return { val: q.ans, wrong: 0, done: true, shown: false, msg: '' }; });
    renderText(); renderQuiz();
    return bothFit();
  }
  function refit() {
    var ae = document.activeElement, sel = null, ss = null, se = null;
    if (ae && ae !== document.body) {
      if (ae.id) sel = '#' + ae.id;
      else if (ae.getAttribute && ae.getAttribute('data-act')) sel = '[data-act="' + ae.getAttribute('data-act') + '"]';
      if (ae.classList && ae.classList.contains('ans')) {
        var fm = ae.closest('form');
        if (fm) S.qs[Number(fm.getAttribute('data-q'))].val = ae.value;
        try { ss = ae.selectionStart; se = ae.selectionEnd; } catch (e) { /* ignore */ }
      }
    }
    var saved = JSON.parse(JSON.stringify(S));
    var lo = 9, hi = 72, best = 9;
    while (hi - lo > 0.5) {
      var mid = (lo + hi) / 2;
      document.documentElement.style.setProperty('--fs', mid + 'px');
      if (fitsAtCurrentSize()) { best = mid; lo = mid; } else { hi = mid; }
    }
    document.documentElement.style.setProperty('--fs', best + 'px');
    S = saved;
    renderText(); renderQuiz();
    if (sel) {
      var e2 = document.querySelector(sel);
      if (e2) {
        e2.focus({ preventScroll: true });
        if (ss !== null) { try { e2.setSelectionRange(ss, se); } catch (e) { /* ignore */ } }
      }
    }
  }

  /* ---------- actions ---------- */
  function act(name, el) {
    var n = SENTENCES.length;
    switch (name) {
      case 'prev':
        S.reveal = Math.max(1, S.reveal - 1);
        S.focus = S.reveal > 1 ? '[data-act="prev"]' : '[data-primary]';
        renderText();
        break;
      case 'rnext':
        S.reveal = Math.min(n, S.reveal + 1); S.focus = '[data-primary]';
        renderText();
        break;
      case 'goq':
        S.phase = 'quiz'; S.cur = 0; S.focus = '#ans-0';
        renderText(); renderQuiz();
        break;
      case 'qnext':
        S.cur = Math.min(S.cur + 1, QUESTIONS.length - 1); S.focus = '#ans-' + S.cur;
        renderText(); renderQuiz();
        break;
      case 'show': {
        var i = Number(el.getAttribute('data-q')), st = S.qs[i];
        st.done = true; st.shown = true; st.msg = '';
        finishIfDone();
        announce('Answer: ' + QUESTIONS[i].say);
        S.focus = allDone() ? '#summary' : '[data-primary]';
        if (allDone()) renderText();
        renderQuiz();
        break;
      }
      case 'redo':
        S.phase = 'read'; S.reveal = 1; S.cur = 0; S.qs = freshQs(); S.saved = false; S.focus = '[data-primary]';
        renderText(); renderQuiz();
        break;
    }
    postRender();
  }

  function submitAnswer(form) {
    var i = Number(form.getAttribute('data-q')), st = S.qs[i], qd = QUESTIONS[i];
    if (st.done) return;
    st.val = form.querySelector('input').value;
    var r = checkAnswer(qd, st.val);
    if (r === null) {
      st.msg = 'empty'; S.focus = '#ans-' + i; announce('Type your answer in the box.');
    } else if (r) {
      st.done = true; st.msg = '';
      finishIfDone();
      announce('Yes. ' + qd.say);
      S.focus = allDone() ? '#summary' : '[data-primary]';
      if (allDone()) renderText();
    } else {
      st.wrong++; st.msg = 'wrong'; S.focus = '#ans-' + i; S.select = true;
      announce('Not yet. Read the highlighted sentence again and try once more.');
    }
    renderQuiz();
    postRender();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    act(el.getAttribute('data-act'), el);
  });
  document.addEventListener('submit', function (e) {
    var form = e.target.closest ? e.target.closest('form.qwrap') : null;
    if (!form) return;
    e.preventDefault();
    submitAnswer(form);
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t && t.classList && t.classList.contains('ans')) {
      var form = t.closest('form.qwrap');
      if (form) S.qs[Number(form.getAttribute('data-q'))].val = t.value;
    }
  });

  var timer = null;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(refit, 150);
  });

  renderText();
  renderQuiz();
  refit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
})();
</script>

</body></html>
